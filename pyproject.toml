[project]
name = "generator-eval"
version = "0.1.0"
description = "Evaluation harness for the generator component of RAG systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "deepeval>=3.0",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyter>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
